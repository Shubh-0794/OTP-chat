[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# SPA Fallback: Direct all page requests to index.html to prevent 404 Page Not Found
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
